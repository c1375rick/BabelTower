<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>babeltower-poc</title>
<style>
  html,body{background:#101418;color:#dfe7ef;font:14px/1.5 Consolas,Menlo,monospace;margin:0;padding:16px}
  h1{font-size:16px;margin:0 0 10px;color:#7fe08a}
  h2{font-size:13px;margin:18px 0 6px;color:#8ab4f8}
  #status{font-size:15px;color:#ffd479}
  pre{background:#0a0d10;border:1px solid #24303c;padding:8px;max-height:320px;overflow:auto;white-space:pre-wrap}
  input,select,button{font:inherit;background:#0a0d10;color:#dfe7ef;border:1px solid #24303c;padding:4px 6px}
  button{cursor:pointer;background:#1b2733}
  .row{margin:4px 0}
</style>
</head>
<body>
<h1>babeltower-poc-pages</h1>
<div id="status">boot…</div>
<div class="row">bootCount=<span id="bootCount">?</span> localStorage=<span id="lsOk">?</span></div>
<div class="row">userAgent=<span id="ua"></span></div>

<h2>S5 最小翻译 UI</h2>
<div class="row">
  <input id="tx" size="40" value="hello world" />
  <select id="prov">
    <option value="bing">bing(edge 免Key)</option>
    <option value="mymemory" selected>mymemory(免Key)</option>
    <option value="libretranslate">libretranslate(免Key)</option>
  </select>
  <select id="tgt"><option>zh-CN</option><option>zh-Hans</option><option>en</option><option>ja</option></select>
  <button id="go">翻译</button>
</div>
<div class="row" id="transOut">—</div>

<h2>S4 CORS 矩阵(在浏览器/CEF 里点,结果写页面 + console)</h2>
<div class="row"><button id="cors">跑 CORS 矩阵</button></div>
<pre id="corsOut">—</pre>

<h2>日志</h2>
<pre id="log"></pre>

<script>
(function () {
  "use strict";

  // ---------- 小工具(全部防御式:仿真沙箱里没有 DOM/navigator) ----------
  function el(id) {
    try {
      if (typeof document !== "undefined" && document && typeof document.getElementById === "function") {
        return document.getElementById(id);
      }
    } catch (e) {}
    return null;
  }
  function setText(id, s) { var n = el(id); if (n) { try { n.textContent = String(s); } catch (e) {} } }

  var LOG = [];
  function log(m) {
    var line = new Date().toISOString() + " " + m;
    LOG.push(line);
    try { console.log("[POC-PAGE] " + m); } catch (e) {}
    setText("log", LOG.slice(-60).join("\n"));
  }
  function setStatus(s) { setText("status", s); }

  // ---------- S3:localStorage 探测 + boot 计数 ----------
  var LS_OK = false, BOOT_COUNT = null;
  try {
    localStorage.setItem("__poc_probe__", "1");
    localStorage.removeItem("__poc_probe__");
    LS_OK = true;
  } catch (e) { LS_OK = false; }
  if (LS_OK) {
    try {
      BOOT_COUNT = parseInt(localStorage.getItem("pocBootCount") || "0", 10) + 1;
      localStorage.setItem("pocBootCount", String(BOOT_COUNT));
    } catch (e) { BOOT_COUNT = null; }
  }
  setText("bootCount", BOOT_COUNT === null ? "n/a" : BOOT_COUNT);
  setText("lsOk", LS_OK ? "yes" : "no");
  try {
    if (typeof navigator !== "undefined" && navigator) setText("ua", String(navigator.userAgent || ""));
  } catch (e) {}

  // ---------- S1:页面活着标记(写 document.title → 引擎 HTMLTitle) ----------
  var ALIVE = "POC-ALIVE " + new Date().toISOString();
  function setTitle(t) { try { document.title = String(t); } catch (e) {} }

  // ---------- 回程协议:title = "LCT" + id + JSON(与 lingua_chat hash 通道一致) ----------
  function reply(id, obj) {
    try { setTitle("LCT" + String(id) + JSON.stringify(obj)); } catch (e) {}
  }

  // ---------- S4:CORS / fetch 诊断 ----------
  function fetchWithTimeout(url, init, timeoutMs) {
    var opts = init ? Object.assign({}, init) : {};
    var ctl = null;
    if (typeof AbortController === "function") {
      ctl = new AbortController();
      opts.signal = ctl.signal;
    }
    var timer = null;
    if (ctl) {
      timer = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, timeoutMs || 15000);
    }
    return new Promise(function (resolve) {
      var done = false;
      function fin(r) { if (done) return; done = true; if (timer) { try { clearTimeout(timer); } catch (e) {} } resolve(r); }
      try {
        fetch(url, opts).then(function (res) {
          return res.text().then(function (body) {
            fin({ ok: res.ok, status: res.status, type: res.type, body: body });
          }, function () { fin({ ok: res.ok, status: res.status, type: res.type, body: "" }); });
        }, function (err) {
          fin({ ok: false, corsBlocked: true, error: String((err && err.message) || err), name: String((err && err.name) || "") });
        });
      } catch (e) {
        fin({ ok: false, corsBlocked: true, error: String((e && e.message) || e) });
      }
      if (!ctl) {
        // 无 AbortController:用 setTimeout 兜底(只在沙箱里走这条)
        setTimeout(function () { fin({ ok: false, error: "timeout_no_abort", timeout: true }); }, timeoutMs || 15000);
      }
    });
  }

  var ENDPOINTS = {
    "bing-edge": { url: "https://edge.microsoft.com/translate/translatetext?to=zh-Hans&isEnterpriseClient=false", method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(["hello world"]) },
    "openai": { url: "https://api.openai.com/v1/chat/completions", method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer no-key-poc" }, body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: "translate to Chinese: hello" }] }) },
    "deepl-free": { url: "https://api-free.deepl.com/v2/translate", method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "text=hello&target_lang=ZH" },
    "google-v2": { url: "https://translation.googleapis.com/language/translate/v2?key=no-key-poc&q=hello&target=zh-CN", method: "GET" },
    "mymemory": { url: "https://api.mymemory.translated.net/get?q=hello%20world&langpair=en|zh-CN", method: "GET" },
    "libretranslate-com": { url: "https://libretranslate.com/translate", method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: "hello world", source: "en", target: "zh", format: "text" }) },
    "libretranslate-terraprint": { url: "https://translate.terraprint.co/translate", method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: "hello world", source: "en", target: "zh", format: "text" }) }
  };

  function corsProbe(name) {
    var e = ENDPOINTS[name];
    var init = { method: e.method, mode: "cors", credentials: "omit" };
    if (e.headers) init.headers = e.headers;
    if (e.body != null && e.method !== "GET") init.body = e.body;
    var t0 = Date.now();
    return fetchWithTimeout(e.url, init, 15000).then(function (r) {
      r.ms = Date.now() - t0;
      r.endpoint = name;
      return r;
    });
  }

  function runCorsMatrix() {
    var names = Object.keys(ENDPOINTS);
    var lines = [];
    setText("corsOut", "running…");
    var i = 0;
    function next() {
      if (i >= names.length) {
        setText("corsOut", lines.join("\n"));
        log("CORS matrix done");
        return;
      }
      var name = names[i++];
      corsProbe(name).then(function (r) {
        var verdict = r.corsBlocked ? "BLOCKED/" + (r.error || "") : ("HTTP " + r.status + (r.ok ? " OK" : ""));
        var snip = String(r.body || "").replace(/\s+/g, " ").slice(0, 120);
        lines.push(pad(name, 26) + " " + pad(verdict, 42) + " " + r.ms + "ms  " + snip);
        setText("corsOut", lines.join("\n"));
        log("cors " + name + " -> " + verdict + " (" + r.ms + "ms)");
        next();
      });
    }
    next();
  }
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }

  // ---------- S5:最小翻译(免 Key 路径) ----------
  function translate(provider, text, target) {
    if (provider === "bing") {
      var url = "https://edge.microsoft.com/translate/translatetext?to=" + encodeURIComponent(target || "zh-Hans") + "&isEnterpriseClient=false";
      return fetchWithTimeout(url, { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify([String(text)]) }, 15000)
        .then(function (r) {
          if (r.corsBlocked) return { ok: false, error: "CORS/" + r.error };
          if (r.status !== 200) return { ok: false, error: "HTTP " + r.status, body: String(r.body || "").slice(0, 200) };
          var j = null; try { j = JSON.parse(r.body); } catch (e) {}
          var t2 = j && j[0] && j[0].translations && j[0].translations[0] && j[0].translations[0].text;
          return t2 ? { ok: true, translation: String(t2) } : { ok: false, error: "no_translation", body: String(r.body || "").slice(0, 200) };
        });
    }
    if (provider === "libretranslate") {
      return fetchWithTimeout(ENDPOINTS["libretranslate-terraprint"].url, { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: String(text), source: "auto", target: "zh", format: "text" }) }, 15000)
        .then(function (r) {
          if (r.corsBlocked) return { ok: false, error: "CORS/" + r.error };
          var j = null; try { j = JSON.parse(r.body); } catch (e) {}
          return (j && j.translatedText) ? { ok: true, translation: String(j.translatedText) } : { ok: false, error: "HTTP " + r.status + " " + String(r.body || "").slice(0, 120) };
        });
    }
    // 默认 mymemory(简单 GET,无需预检)
    var mu = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(String(text)) + "&langpair=" + encodeURIComponent("en|" + (target === "zh-Hans" ? "zh-CN" : (target || "zh-CN")));
    return fetchWithTimeout(mu, { method: "GET", mode: "cors" }, 15000).then(function (r) {
      if (r.corsBlocked) return { ok: false, error: "CORS/" + r.error };
      var j = null; try { j = JSON.parse(r.body); } catch (e) {}
      var t3 = j && j.responseData && j.responseData.translatedText;
      return t3 ? { ok: true, translation: String(t3) } : { ok: false, error: "HTTP " + r.status + " " + String(r.body || "").slice(0, 120) };
    });
  }

  // ---------- hash 上行命令通道(#LCTQ: + encodeURIComponent(JSON)) ----------
  // 路由按 msg.op(q 是与桥页一致的“去重 nonce”,不是命令名)
  var hashSeq = 0, lastHash = null;
  function onHash(msg) {
    pushTrace("command " + msg.op);
    var d = (msg && msg.d) || {};
    var id = msg && msg.id;
    var op = String((msg && msg.op) || "");
    try {
      if (op === "echo") {
        reply(id, { ok: true, echo: d.text, seq: ++hashSeq, at: Date.now(), alive: ALIVE });
        return;
      }
      if (op === "alive") {
        reply(id, { ok: true, alive: ALIVE, bootCount: BOOT_COUNT, lsOk: LS_OK });
        return;
      }
      if (op === "store") {
        var sv = "store_failed";
        try { localStorage.setItem(String(d.k), String(d.v)); sv = "stored:" + String(d.v); } catch (e) { sv = "store_error:" + e.message; }
        reply(id, { ok: sv.indexOf("stored") === 0, result: sv, lsOk: LS_OK });
        return;
      }
      if (op === "load") {
        var lv = null, le = null;
        try { lv = localStorage.getItem(String(d.k)); } catch (e) { le = e.message; }
        reply(id, { ok: le === null, value: lv, bootCount: BOOT_COUNT, lsOk: LS_OK, error: le });
        return;
      }
      if (op === "cors") {
        corsProbe(d.endpoint).then(function (r) {
          reply(id, { ok: !r.corsBlocked, corsBlocked: !!r.corsBlocked, status: r.status || 0,
            error: r.error || null, ms: r.ms || 0, body: String(r.body || "").slice(0, 300) });
        });
        return;
      }
      if (op === "translate") {
        var t0 = Date.now();
        translate(d.provider || "mymemory", d.text || "", d.target || "zh-CN").then(function (r) {
          r.ms = Date.now() - t0; r.provider = d.provider || "mymemory";
          reply(id, r);
        });
        return;
      }
      reply(id, { ok: false, error: "unknown_op:" + op });
    } catch (e) {
      reply(id, { ok: false, error: "handler_threw:" + (e && e.message) });
    }
  }

  function handleFragment(rawHash) {
    var h = String(rawHash || "");
    if (h.charAt(0) === "#") h = h.slice(1);
    if (h.indexOf("LCTQ:") !== 0) return;
    var msg = null;
    try { msg = JSON.parse(decodeURIComponent(h.slice(5))); } catch (e) { log("fragment parse error: " + e.message); return; }
    if (!msg || !msg.q) return;
    if (msg.q === lastHash) { pushTrace("dup " + msg.q); return; } // 同 q 去重(与桥页一致)
    lastHash = msg.q;
    onHash(msg);
  }

  var TRACE = [];
  function pushTrace(s) { TRACE.push(new Date().toISOString() + " " + s); setText("corsOut", null); }

  // ---------- 页面启动 ----------
  setStatus(ALIVE);
  setTitle(ALIVE);
  log("boot lsOk=" + LS_OK + " bootCount=" + BOOT_COUNT + " ua=" + (function () { try { return navigator.userAgent; } catch (e) { return "n/a"; } })());

  try {
    if (typeof window !== "undefined" && window && typeof window.addEventListener === "function") {
      window.addEventListener("hashchange", function () { handleFragment(location.hash); });
    }
  } catch (e) {}
  try { handleFragment(location.hash); } catch (e) {}

  // ---------- 导出(供仿真/调试) ----------
  var API = {
    alive: ALIVE, log: log, ENDPOINTS: ENDPOINTS, corsProbe: corsProbe,
    runCorsMatrix: runCorsMatrix, translate: translate, handleFragment: handleFragment,
    get trace() { return TRACE.slice(); },
    get bootCount() { return BOOT_COUNT; },
    get lsOk() { return LS_OK; }
  };
  try { globalThis.POC_PAGE = API; } catch (e) {}
  try { window.POC_PAGE = API; } catch (e) {}

  var goBtn = el("go");
  if (goBtn) {
    goBtn.onclick = function () {
      var txt = (el("tx") && el("tx").value) || "hello world";
      var prov = (el("prov") && el("prov").value) || "mymemory";
      var tgt = (el("tgt") && el("tgt").value) || "zh-CN";
      setText("transOut", "…");
      translate(prov, txt, tgt).then(function (r) {
        setText("transOut", r.ok ? ("[" + prov + "] " + r.translation) : ("FAILED [" + prov + "] " + r.error));
        log("ui translate " + prov + " -> " + (r.ok ? r.translation : r.error));
      });
    };
  }
  var corsBtn = el("cors");
  if (corsBtn) corsBtn.onclick = runCorsMatrix;
})();
</script>
</body>
</html>
