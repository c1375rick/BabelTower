<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babel Tower</title>
<style>
  :root {
    --bg: #14161a; --card: #1c1f26; --line: #2c313c; --fg: #e6e8ee;
    --dim: #9aa3b2; --accent: #6ea8ff; --ok: #46c281; --warn: #e0b341; --bad: #e2605c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 22px 18px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--dim); font-size: 12.5px; margin: 8px 0 18px; }
  .langpick { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
  .langpick label { margin: 0; }
  .langpick select { width: auto; padding: 5px 8px; font-size: 12.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: baseline; padding: 7px 0;
    border-bottom: 1px dashed rgba(255,255,255,.05); }
  .row:last-child { border-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: 0 0 auto;
    transform: translateY(-1px); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(70,194,129,.5); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.idle { background: #555; }
  .k { flex: 0 0 200px; }
  .k small { display: block; color: var(--dim); font-size: 11.5px; }
  .v { color: var(--fg); font-variant-numeric: tabular-nums; }
  .v .age { color: var(--dim); }
  label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 12.5px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; background: #12141a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 10px; font: inherit; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 160px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .checks { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; }
  .checks label { display: flex; gap: 7px; align-items: center; margin: 0; color: var(--fg); }
  .btns { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: #0b1220; border: 0; border-radius: 7px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 12.5px; color: var(--dim); }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .badge { display: inline-block; border: 1px solid var(--line); border-radius: 99px;
    padding: 1px 9px; font-size: 11.5px; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .hide { display: none; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12.5px; }
  #testOut { white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span data-i18n="title"></span> <span class="badge" id="ver">…</span></h1>
    <div class="langpick">
      <label for="uiLang" data-i18n="lang_label"></label>
      <select id="uiLang"></select>
    </div>
  </div>
  <div class="sub" data-i18n="top_note"></div>

  <div class="card">
    <h2><span data-i18n="health_title"></span>
      <span class="badge" id="gameState">…</span>
      <span class="badge hide" id="gameLangBadge"></span>
    </h2>
    <div class="row">
      <div class="dot idle" id="dot-btpcDl"></div>
      <div class="k"><span data-i18n="ch_btpc_dl"></span><small data-i18n="ch_btpc_dl_sub"></small></div>
      <div class="v" id="age-btpcDl">—</div>
    </div>
    <div class="row">
      <div class="dot idle" id="dot-consoleLog"></div>
      <div class="k"><span data-i18n="ch_console"></span><small data-i18n="ch_console_sub"></small></div>
      <div class="v" id="age-consoleLog">—</div>
    </div>
    <div class="row">
      <div class="dot idle" id="dot-bridgeNav"></div>
      <div class="k"><span data-i18n="ch_nav"></span><small data-i18n="ch_nav_sub"></small></div>
      <div class="v" id="age-bridgeNav">—</div>
    </div>
    <div class="row">
      <div class="dot idle" id="dot-gameFetch"></div>
      <div class="k"><span data-i18n="ch_fetch"></span><small data-i18n="ch_fetch_sub"></small></div>
      <div class="v" id="age-gameFetch">—</div>
    </div>
    <div class="note"><span id="healthNote"></span></div>
    <div class="note" id="dupNote" style="display:none;color:#c0392b;font-weight:600"></div>
  </div>

  <div class="card">
    <h2 data-i18n="tr_title"></h2>
    <div class="grid">
      <div>
        <label for="provider" data-i18n="tr_provider"></label>
        <select id="provider"></select>
      </div>
      <div id="row-apiKey">
        <label for="apiKey" data-i18n="tr_key"></label>
        <input type="password" id="apiKey" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="note hide" id="noKeyNote" data-i18n="tr_nokey_note"></div>
    <div class="grid">
      <div id="row-region">
        <label for="region" data-i18n="tr_region"></label>
        <input type="text" id="region" spellcheck="false">
      </div>
      <div id="row-endpoint">
        <label for="endpoint" data-i18n="tr_endpoint"></label>
        <input type="text" id="endpoint" spellcheck="false">
      </div>
      <div id="row-baseUrl">
        <label for="baseUrl" data-i18n="tr_baseurl"></label>
        <input type="text" id="baseUrl" spellcheck="false">
      </div>
      <div id="row-model">
        <label for="model" data-i18n="tr_model"></label>
        <input type="text" id="model" spellcheck="false">
      </div>
    </div>
    <div class="grid">
      <div>
        <label for="fallback" data-i18n="tr_fallback"></label>
        <input type="text" id="fallback" data-i18n-ph="tr_fallback_ph" spellcheck="false">
      </div>
      <div>
        <label for="timeoutMs" data-i18n="tr_timeout"></label>
        <input type="number" id="timeoutMs" min="1000" step="500">
      </div>
    </div>
    <div class="grid">
      <div>
        <label for="sourceLanguage" data-i18n="tr_srclang"></label>
        <input type="text" id="sourceLanguage" placeholder="auto" spellcheck="false">
      </div>
      <div>
        <label for="targetLanguage" data-i18n="tr_targetlang"></label>
        <input type="text" id="targetLanguage" spellcheck="false">
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="translateOwn"> <span data-i18n="tr_own"></span></label>
      <label><input type="checkbox" id="chatLog"> <span data-i18n="tr_chatlog"></span></label>
    </div>
    <div class="btns">
      <button id="save" data-i18n="tr_save"></button>
      <button class="ghost" id="reload" data-i18n="tr_reload"></button>
      <button class="ghost" id="test" data-i18n="tr_test"></button>
      <span class="status" id="cfgStatus"></span>
    </div>
    <div class="note" id="testOut"></div>
  </div>

  <div class="card">
    <h2 data-i18n="bh_title"></h2>
    <div class="grid">
      <div>
        <label for="uiEnabled" data-i18n="bh_enabled"></label>
        <select id="uiEnabled">
          <option value="1" data-i18n="bh_on"></option>
          <option value="0" data-i18n="bh_off"></option>
        </select>
      </div>
      <div>
        <label for="displayMode" data-i18n="bh_display"></label>
        <select id="displayMode">
          <option value="bilingual" data-i18n="bh_display_bilingual"></option>
          <option value="translation_only" data-i18n="bh_display_only"></option>
        </select>
      </div>
      <div>
        <label for="outgoing" data-i18n="bh_outgoing"></label>
        <select id="outgoing">
          <option value="off" data-i18n="bh_out_off"></option>
          <option value="translation" data-i18n="bh_out_translation"></option>
          <option value="bilingual" data-i18n="bh_out_bilingual"></option>
        </select>
      </div>
      <div>
        <label for="outgoingTarget" data-i18n="bh_target"></label>
        <select id="outgoingTarget">
          <option value="en">English</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="custom" data-i18n="bh_custom"></option>
        </select>
      </div>
      <div id="row-outgoingCustom">
        <label for="outgoingTargetCustom" data-i18n="bh_custom_label"></label>
        <input type="text" id="outgoingTargetCustom" data-i18n-ph="bh_custom_ph" spellcheck="false">
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="force"> <span data-i18n="bh_force"></span></label>
    </div>
    <div class="grid">
      <div>
        <label for="uiTimeoutMs" data-i18n="bh_ui_timeout"></label>
        <input type="number" id="uiTimeoutMs" min="5000" max="30000" step="1000">
      </div>
    </div>
    <div class="note" data-i18n="bh_note"></div>
    <div class="note" data-i18n="bh_sync"></div>
  </div>

  <div class="card">
    <details>
      <summary data-i18n="adv_summary"></summary>
      <label for="raw" data-i18n="adv_label"></label>
      <textarea id="raw" spellcheck="false"></textarea>
      <div class="btns">
        <button class="ghost" id="rawSave" data-i18n="adv_save"></button>
        <span class="status" id="rawStatus"></span>
      </div>
    </details>
  </div>

  <div class="note" data-i18n="footer_note"></div>
</div>

  // ---------- i18n ----------
  var LANG = "zh-Hans";       // 当前生效语言
  var storeMode = "auto";     // auto | 具体语言代码
  var gameLang = null;        // 游戏侧语言(zh/en),由桥的 health 提供
  var lastCfg = null;
  var providerMeta = { bing: { requiresKey: false, acceptsKey: false } };
  var providerSig = "";
  var statusState = {};       // elId -> {key, params, cls}

  function t(key, params) {
    var dict = I18N[LANG] || I18N["zh-Hans"];
    var s = dict[key];
    if (s === undefined) s = I18N["en"][key];
    if (s === undefined) s = key;
    if (params) {
      for (var k in params) {
        if (Object.prototype.hasOwnProperty.call(params, k)) s = s.split("{" + k + "}").join(String(params[k]));
      }
    }
    return s;
  }

  function langLabel(code) {
    for (var i = 0; i < LANGS.length; i += 1) if (LANGS[i].code === code) return LANGS[i].label;
    return code;
  }

  function detectFromNavigator() {
    var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < tags.length; i += 1) {
      var low = String(tags[i] || "").replace("_", "-").toLowerCase();
      if (!low) continue;
      if (low.indexOf("zh") === 0) {
        return (low.indexOf("tw") >= 0 || low.indexOf("hk") >= 0 || low.indexOf("hant") >= 0) ? "zh-Hant" : "zh-Hans";
      }
      for (var j = 0; j < LANGS.length; j += 1) {
        if (low.indexOf(LANGS[j].code.toLowerCase()) === 0) return LANGS[j].code;
      }
      if (low.indexOf("pt") === 0) return "pt-BR";
    }
    return "en";
  }

  function resolveLang() {
    if (storeMode !== "auto") return storeMode;
    if (gameLang === "zh") return "zh-Hans";
    if (gameLang === "en") return "en";
    return detectFromNavigator();
  }

  function applyI18n() {
    document.documentElement.lang = LANG === "zh-Hans" ? "zh-Hans" : LANG;
    document.title = t("title");
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i += 1) els[i].textContent = t(els[i].getAttribute("data-i18n"));
    var phs = document.querySelectorAll("[data-i18n-ph]");
    for (var j = 0; j < phs.length; j += 1) phs[j].placeholder = t(phs[j].getAttribute("data-i18n-ph"));
    // 重放状态文案
    for (var id in statusState) {
      if (!Object.prototype.hasOwnProperty.call(statusState, id)) continue;
      var el = $(id);
      if (!el) continue;
      setStatus(id, statusState[id].key, statusState[id].params, statusState[id].cls, true);
    }
    buildLangSelect();
    ensureProviders();
    refreshProviderRows();
    if (lastCfg) $("raw").value = JSON.stringify(lastCfg, null, 2);
  }

  function buildLangSelect() {
    var sel = $("uiLang");
    var cur = sel.value || storeMode;
    sel.innerHTML = "";
    var o0 = document.createElement("option");
    o0.value = "auto";
    o0.textContent = t("lang_auto");
    sel.appendChild(o0);
    for (var i = 0; i < LANGS.length; i += 1) {
      var o = document.createElement("option");
      o.value = LANGS[i].code;
      o.textContent = LANGS[i].label;
      sel.appendChild(o);
    }
    sel.value = cur;
    if (!sel.value) sel.value = "auto";
  }

  function switchLang(mode) {
    storeMode = mode;
    try { localStorage.setItem(STORE_KEY, mode); } catch (e) {}
    LANG = resolveLang();
    $("uiLang").value = mode;
    applyI18n();
  }

  // ---------- 通用 ----------
  function fetchJson(path, opt) {
    return fetch(path, Object.assign({ cache: "no-store" }, opt || {})).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    });
  }

  function setStatus(id, key, params, cls, quiet) {
    var el = $(id);
    if (!el) return;
    statusState[id] = { key: key, params: params, cls: cls };
    el.textContent = t(key, params);
    el.className = "status" + (cls ? " " + cls : "");
    if (quiet) return;
  }

  function rel(ts, now) {
    if (!ts) return t("time_never");
    var s = Math.max(0, Math.round((now - ts) / 1000));
    if (s < 3) return t("time_just");
    if (s < 60) return t("time_sec", { n: s });
    if (s < 3600) return t("time_min", { n: Math.round(s / 60) });
    return t("time_hour", { n: Math.round(s / 3600) });
  }

  // ---------- 通道健康 ----------
  function paintChannel(key, ts, now, gameRunning) {
    var dot = $("dot-" + key);
    var val = $("age-" + key);
    var age = ts ? now - ts : Infinity;
    var cls = "idle";
    if (ts) {
      if (age < 60000) cls = "ok";
      else if (age < 600000) cls = "warn";
      else cls = gameRunning ? "bad" : "idle";
    }
    dot.className = "dot " + cls;
    var a = document.createElement("span");
    a.className = "age";
    a.textContent = rel(ts, now);
    val.textContent = "";
    val.appendChild(a);
  }

  function loadHealth() {
    fetchJson("/api/v1/health").then(function (r) {
      var j = r.body || {};
      if (!j.ok) return;
      $("ver").textContent = "v" + (j.version || "?");
      // 排外告警(2026-10-28):桥侧 addons 扫描发现多份含 BabelTower 面板的 vpk 并存
      var fp = j.foreignPaks;
      var dupNote = $("dupNote");
      if (dupNote) {
        if (fp && fp.duplicates) {
          var names = (fp.items || []).map(function (h) { return h.file + " (" + h.version + ")"; }).join("、");
          dupNote.textContent = "⚠️ 检测到 " + fp.count + " 份 BabelTower 并存: " + names + " — 同 ID 面板混合加载会导致版本串错乱/行为不可预测,请只保留一份(其余改名加 .bak 或经 DMM 卸载)";
          dupNote.style.display = "block";
        } else {
          dupNote.style.display = "none";
        }
      }
      var game = !!j.gameRunning;
      $("gameState").textContent = game ? t("health_game_on") : t("health_game_off");
      if (j.gameLang) {
        gameLang = j.gameLang;
        var badge = $("gameLangBadge");
        badge.className = "badge";
        badge.textContent = t("health_game_lang", { lang: langLabel(gameLang === "zh" ? "zh-Hans" : "en") });
        if (storeMode === "auto") {
          var want = resolveLang();
          if (want !== LANG) { LANG = want; applyI18n(); }
        }
      }
      var ch = (j.channels && j.channels.byChannel) || {};
      var now = (j.channels && j.channels.now) || Date.now();
      var started = (j.channels && j.channels.startedAt) || 0;
      $("healthNote").textContent = t("health_note", {
        t: started ? new Date(started).toLocaleString() : "—"
      });
      ["btpcDl", "consoleLog", "bridgeNav", "gameFetch"].forEach(function (k) {
        paintChannel(k, ch[k] || 0, now, game);
      });
      // 服务商列表以桥为准(以后加 provider 不用改页面)
      var provs = Array.isArray(j.providers) ? j.providers : [];
      if (provs.length) {
        provs.forEach(function (p) { providerMeta[p.id] = p; });
        var sig = provs.map(function (p) {
          return p.id + ":" + (p.requiresKey !== false) + ":" + (p.acceptsKey !== false);
        }).join(",");
        if (sig !== providerSig) {
          providerSig = sig;
          rebuildProviders(provs);
        }
      }
    }).catch(function () {
      $("gameState").textContent = t("health_bridge_down");
    });
  }

  // ---------- 服务商 ----------
  // 兜底清单:桥不可达(或老版本桥)时下拉也要有内容,否则整个表单没法用。
  var DEFAULT_PROVIDERS = [
    { id: "bing", label: "Bing (free)", requiresKey: false, acceptsKey: false },
    { id: "microsoft", label: "Microsoft (Azure)", requiresKey: true, acceptsKey: true },
    { id: "openai", label: "OpenAI-compatible", requiresKey: true, acceptsKey: true },
    { id: "deepl", label: "DeepL", requiresKey: true, acceptsKey: true },
    { id: "google", label: "Google", requiresKey: false, acceptsKey: true }
  ];

  function ensureProviders() {
    if ($("provider").options.length) return;
    rebuildProviders(DEFAULT_PROVIDERS);
  }

  function rebuildProviders(provs) {
    var sel = $("provider");
    var cur = sel.value;
    sel.innerHTML = "";
    provs.forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.label || p.id;
      sel.appendChild(o);
    });
    var keep = null;
    for (var i = 0; i < provs.length; i += 1) if (provs[i].id === cur) { keep = cur; break; }
    sel.value = keep || (lastCfg && lastCfg.provider) || provs[0].id;
    refreshProviderRows();
  }

  function refreshProviderRows() {
    var p = $("provider").value;
    var meta = providerMeta[p] || {};
    var acceptsKey = meta.acceptsKey !== false;
    $("row-apiKey").classList.toggle("hide", !acceptsKey);
    $("noKeyNote").classList.toggle("hide", acceptsKey);
    $("row-region").classList.toggle("hide", p !== "microsoft");
    $("row-endpoint").classList.toggle("hide", p !== "microsoft" && p !== "deepl");
    $("row-baseUrl").classList.toggle("hide", p !== "openai");
    $("row-model").classList.toggle("hide", p !== "openai");
    if (p === "microsoft" && lastCfg) {
      $("endpoint").value = (lastCfg.microsoft && lastCfg.microsoft.endpoint) || "";
    } else if (p === "deepl" && lastCfg) {
      $("endpoint").value = (lastCfg.deepl && lastCfg.deepl.endpoint) || "";
    }
    var has = false;
    if (lastCfg) has = !!((lastCfg[p] || {}).hasApiKey);
    $("apiKey").placeholder = has ? t("tr_key_saved") : t("tr_key_unset");
    $("apiKey").value = "";
  }

  // ---------- 配置 ----------
  function fillForm(cfg) {
    lastCfg = cfg;
    $("provider").value = cfg.provider || "bing";
    $("region").value = (cfg.microsoft && cfg.microsoft.region) || "";
    $("baseUrl").value = (cfg.openai && cfg.openai.baseUrl) || "";
    $("model").value = (cfg.openai && cfg.openai.model) || "";
    $("fallback").value = Array.isArray(cfg.fallbackProviders) ? cfg.fallbackProviders.join(", ") : "";
    $("timeoutMs").value = cfg.timeoutMs || "";
    $("sourceLanguage").value = (cfg.defaults && cfg.defaults.sourceLanguage) || "auto";
    $("targetLanguage").value = (cfg.defaults && cfg.defaults.targetLanguage) || "zh-Hans";
    $("translateOwn").checked = cfg.translateOwn !== false;
    $("chatLog").checked = !(cfg.chatLog && cfg.chatLog.enabled === false);
    var ui = cfg.ui || {};
    $("uiEnabled").value = (ui.enabled === false) ? "0" : "1";
    $("displayMode").value = ui.displayMode || "bilingual";
    $("outgoing").value = ui.outgoing || "off";
    setOutgoingTargetValue(ui.outgoingTarget || "en");
    $("force").checked = !!ui.force;
    $("uiTimeoutMs").value = ui.timeoutMs || 15000;
    $("raw").value = JSON.stringify(cfg, null, 2);
    refreshProviderRows();
  }

  var OUT_TARGETS = ["en", "zh-Hans", "zh-Hant", "ja", "ko", "fr", "de", "es", "ru", "pt-BR"];
  function refreshOutgoingCustomRow() {
    $("row-outgoingCustom").classList.toggle("hide", $("outgoingTarget").value !== "custom");
  }
  function setOutgoingTargetValue(v) {
    var sel = $("outgoingTarget");
    if (OUT_TARGETS.indexOf(v) !== -1) {
      sel.value = v;
      $("outgoingTargetCustom").value = "";
    } else {
      sel.value = "custom";
      $("outgoingTargetCustom").value = v || "";
    }
    refreshOutgoingCustomRow();
  }
  function currentOutgoingTarget() {
    if ($("outgoingTarget").value !== "custom") return $("outgoingTarget").value;
    return $("outgoingTargetCustom").value.trim() || "en";
  }

  function loadConfig() {
    setStatus("cfgStatus", "st_reading");
    fetchJson("/api/v1/config?full=1").then(function (r) {
      var j = r.body || {};
      if (!j.ok || !j.config) throw new Error((j && j.error) || "load_failed");
      fillForm(j.config);
      setStatus("cfgStatus", "st_loaded", null, "ok");
    }).catch(function (e) {
      setStatus("cfgStatus", "st_loadfail", { err: e.message || e }, "bad");
    });
  }

  function collectForm() {
    var p = $("provider").value;
    var out = {
      provider: p,
      fallbackProviders: $("fallback").value.split(",").map(function (s) { return s.trim(); })
        .filter(function (s) { return !!s; }),
      timeoutMs: Number($("timeoutMs").value) || undefined,
      translateOwn: $("translateOwn").checked,
      chatLog: { enabled: $("chatLog").checked },
      openai: {
        baseUrl: $("baseUrl").value.trim() || undefined,
        model: $("model").value.trim() || undefined
      },
      microsoft: { region: $("region").value.trim() || undefined },
      deepl: {}
    };
    var ep = $("endpoint").value.trim();
    if (p === "microsoft") out.microsoft.endpoint = ep || undefined;
    if (p === "deepl") out.deepl.endpoint = ep || undefined;
    var meta = providerMeta[p] || {};
    var key = $("apiKey").value.trim();
    // 不收 Key 的 provider(bing)绝不能带扁平 apiKey:桥端扁平字段按 provider 落段,
    // bing 会落到 microsoft 分支,把微软的 Key 改掉。
    if (key && meta.acceptsKey !== false) out.apiKey = key;
    // 游戏内行为:写进 ui.*(游戏侧 syncPanelFromConfig 只认 c.ui.*),面板/网页两条路同语义
    var targetLang = $("targetLanguage").value.trim() || "zh-Hans";
    out.defaults = { sourceLanguage: $("sourceLanguage").value.trim() || "auto", targetLanguage: targetLang };
    out.ui = {
      enabled: $("uiEnabled").value === "1",
      provider: p,
      displayMode: $("displayMode").value,
      outgoing: $("outgoing").value,
      outgoingTarget: currentOutgoingTarget(),
      targetLanguage: targetLang,
      force: $("force").checked,
      timeoutMs: Number($("uiTimeoutMs").value) || 15000
    };
    return out;
  }

  function save(payload, statusElId) {
    setStatus(statusElId, "st_saving");
    fetchJson("/api/v1/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ config: payload })
    }).then(function (r) {
      var j = r.body || {};
      if (!j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
      setStatus(statusElId, "st_saved", null, "ok");
      loadConfig();
    }).catch(function (e) {
      setStatus(statusElId, "st_savefail", { err: e.message || e }, "bad");
    });
  }

  // ---------- 事件 ----------
  $("uiLang").addEventListener("change", function () { switchLang($("uiLang").value); });
  $("provider").addEventListener("change", refreshProviderRows);
  $("outgoingTarget").addEventListener("change", refreshOutgoingCustomRow);
  $("reload").addEventListener("click", loadConfig);
  $("save").addEventListener("click", function () { save(collectForm(), "cfgStatus"); });

  $("rawSave").addEventListener("click", function () {
    var raw;
    try { raw = JSON.parse($("raw").value); }
    catch (e) { setStatus("rawStatus", "adv_badjson", { err: e.message }, "bad"); return; }
    save(raw, "rawStatus");
  });

  $("test").addEventListener("click", function () {
    var btn = $("test");
    btn.disabled = true;
    setStatus("cfgStatus", "st_testing");
    $("testOut").textContent = "";
    fetchJson("/api/v1/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: "Hello, this is a Babel Tower connection test." })
    }).then(function (r) {
      var j = r.body || {};
      if (j.ok) {
        setStatus("cfgStatus", "st_testok", null, "ok");
        $("testOut").textContent = t("test_result", { t: j.translation || "" });
      } else {
        setStatus("cfgStatus", "st_testfail", null, "bad");
        $("testOut").textContent = t("test_error", { e: j.error || ("HTTP " + r.status) });
      }
    }).catch(function (e) {
      setStatus("cfgStatus", "st_testfail", null, "bad");
      $("testOut").textContent = t("test_error", { e: e.message || e });
    }).then(function () { btn.disabled = false; });
  });

  // ---------- 启动 ----------
  try { storeMode = localStorage.getItem(STORE_KEY) || "auto"; } catch (e) { storeMode = "auto"; }
  if (storeMode !== "auto") {
    var ok = false;
    for (var i = 0; i < LANGS.length; i += 1) if (LANGS[i].code === storeMode) ok = true;
    if (!ok) storeMode = "auto";
  }
  LANG = resolveLang();
  buildLangSelect();
  $("uiLang").value = storeMode;
  applyI18n();
  loadConfig();
  loadHealth();
  refreshOutgoingCustomRow();
  setInterval(loadHealth, HEALTH_MS);
})();
</script>
</body>
</html>
